<!DOCTYPE html>
<html lang="ja" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUID生成器 — MyApps</title>
    <meta name="description" content="RFC 4122 準拠の UUID v4 をまとめて生成し、個別または一括でコピーできます。">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../shared/base.css">
    <link rel="stylesheet" href="../../shared/header.css">
    <link rel="stylesheet" href="style.css">
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('myapps-theme') || 'system');
    </script>
</head>
<body>
    <main class="app-main">
        <div class="gen-dashboard card glass">
            <div class="dashboard-header">
                <div class="header-left">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.02-.3 3"/><path d="M14 22a10 10 0 0 0 8-10V9a4 4 0 0 0-8 0v3c0 1.02-.1 2.02-.3 3"/><path d="M18 22a2 2 0 0 0 2-2V9a6 6 0 0 0-12 0v3c0 1.02-.1 2.02-.3 3"/><path d="M22 12c0-6.627-5.373-12-12-12S2 5.373 2 12v3c0 1.02-.1 2.02-.3 3"/><path d="M2 12a10 10 0 0 1 5-8.66"/><path d="M7 22a2 2 0 0 0 2-2V7a8 8 0 0 0-5 5"/></svg>
                    <label>UUID Generator (v4)</label>
                </div>
                <div class="header-right">
                    <div class="input-inline">
                        <label for="count">生成数</label>
                        <input type="number" id="count" value="10" min="1" max="200" inputmode="numeric">
                    </div>
                </div>
            </div>

            <div class="actions-row">
                <button id="gen-btn" class="btn btn-primary full-width" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/><polyline points="12 7 12 12 15 15"/></svg>
                    新しい UUID を生成
                </button>
            </div>

            <div class="output-container">
                <div class="output-header">
                    <span>生成結果</span>
                    <button id="copy-btn" class="btn-icon-only" type="button" title="すべてコピー" aria-label="生成した UUID をすべてコピー">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
                    </button>
                </div>
                <div id="uuid-list" class="uuid-list"></div>
                <textarea id="output-raw" hidden></textarea>
            </div>
        </div>

        <div class="info-footer">
            <p>※ 1回につき最大 200 件まで生成できます。生成にはブラウザの暗号学的乱数 API を使用します。</p>
        </div>
    </main>
    <script src="../../shared/header.js" data-app-name="UUID生成器" data-app-icon="fingerprint" data-app-color="#6366f1"></script>
    <script src="script.js"></script>
</body>
</html>
