<!DOCTYPE html>
<html lang="ja" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Filter</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="../../shared/header.css">
  <link rel="stylesheet" href="../../shared/loader.css">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('myapps-theme') || 'system');</script>
</head>
<body>
  <!-- ヘッダー挿入用 -->
  
  <!-- ローディング・同意画面 -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-content">
      <!-- 同意画面 -->
      <div id="consent-state">
        <div class="loading-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
        </div>
        <h2 class="loading-title">Privacy Filter</h2>
        <p class="loading-subtitle">
          初回利用時はAIモデルのダウンロードが必要です。<br>
          ファイルサイズが大きいため（約1GB）、Wi-Fi環境でのダウンロードを推奨します。
        </p>
        <button id="consent-btn" class="btn btn-consent">モデルをダウンロードして開始</button>
      </div>

      <!-- ローディング中画面 -->
      <div id="loading-state" style="display: none;">
        <div class="loading-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-loader-2 spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        </div>
        <h2 class="loading-title">Privacy Filter</h2>
        <p class="loading-subtitle" id="status-text">モデルをダウンロード中...</p>
        <div class="progress-track">
          <div class="progress-fill" id="progress-bar" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </div>

  <main class="app-main" id="app-main" style="opacity: 0; pointer-events: none;">
    <div class="card editor-card">
      <div class="editor-header">
        <label for="input-text" class="card-title">入力テキスト</label>
        <div class="controls">
          <select id="dtype-select" class="select" title="モデル精度">
            <option value="q4">q4 (高速・軽量)</option>
            <!-- option value="fp16">fp16 (高精度・重い)</option -->
          </select>
          <button id="process-btn" class="btn btn-primary" disabled>フィルター実行</button>
        </div>
      </div>
      <textarea id="input-text" class="input-area" placeholder="テキストを入力してください... (例: My name is Harry Potter and my email is harry.potter@hogwarts.edu.)">My name is Harry Potter and my email is harry.potter@hogwarts.edu.</textarea>
    </div>

    <div class="card result-card">
      <h2 class="card-title">結果</h2>
      
      <div class="result-tabs">
        <button class="tab-btn active" data-tab="masked">マスキング</button>
        <button class="tab-btn" data-tab="json">JSON</button>
      </div>

      <div class="result-content active" id="result-masked">
        <div id="output-rendered" class="output-rendered">実行ボタンを押してください。</div>
      </div>

      <div class="result-content" id="result-json">
        <pre id="output-json" class="output-json">[]</pre>
      </div>
    </div>
  </main>

  <script src="../../shared/header.js" data-app-name="Privacy Filter" data-app-icon="shield" data-app-color="#10b981"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
