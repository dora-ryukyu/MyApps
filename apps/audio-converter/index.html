<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Converter | MyApps</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../shared/base.css" />
  <link rel="stylesheet" href="../../shared/header.css" />
  <link rel="stylesheet" href="style.css" />
  <script>
    document.documentElement.setAttribute(
      "data-theme",
      localStorage.getItem("myapps-theme") || "system"
    );
  </script>
  <!-- JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- lamejs for MP3 encoding -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
</head>
<body>
  <main class="container">
    <div class="card hero-card">
      <div class="icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-audio-lines"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>
      </div>
      <h1 class="title">Audio Converter</h1>
      <p class="subtitle">ZIPファイルまたは複数の音声ファイルを一気に別の形式（WAV / MP3）に変換します。フォルダ構造も保持されます。</p>
      
      <div class="settings-panel">
        <label class="setting-label">
          <span>出力形式:</span>
          <select id="output-format" class="format-select">
            <option value="wav">WAV</option>
            <option value="mp3">MP3</option>
          </select>
        </label>
      </div>

      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" multiple accept=".ogg, .mp3, .m4a, .wav, .flac, audio/*, .zip, application/zip" hidden />
        <div class="drop-content">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-upload-cloud"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>
          <span class="drop-title">クリックまたはドラッグ＆ドロップ</span>
          <span class="drop-hint">対応形式: 各種音声 (mp3, ogg, wav, m4a等) または .zip</span>
        </div>
      </div>
    </div>

    <div class="card status-card" id="status-card" style="display: none;">
      <div class="status-header">
        <h2 class="status-title">変換ステータス</h2>
        <span class="status-badge" id="status-badge">待機中</span>
      </div>
      
      <div class="progress-container">
        <div class="progress-info">
          <span id="progress-text">準備完了</span>
          <span id="progress-count">0 / 0</span>
        </div>
        <div class="progress-bar-wrapper">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>

      <div class="action-container" id="action-container" style="display: none;">
        <button id="download-btn" class="btn btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-download"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          ZIPでダウンロード (<span id="download-size"></span>)
        </button>
      </div>
      
      <div class="file-list" id="file-list">
        <!-- JSでファイルごとのステータスを追加 -->
      </div>
    </div>
  </main>
  <script src="../../shared/header.js" data-app-name="Audio Converter" data-app-icon="audio-lines" data-app-color="#8b5cf6"></script>
  <script src="script.js"></script>
</body>
</html>
